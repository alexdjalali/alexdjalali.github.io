baseURL = "https://alexdjalali.github.io/"
title = "a.j.djalali"
languageCode = "en"
defaultContentLanguage = "en"
enableEmoji = true
enableRobotsTXT = true
enableGitInfo = true

[services.googleAnalytics]
  id = "G-R50JVPX7MP"

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
  ordered = false

[markup.highlight]
noClasses = false

[markup.goldmark.renderer]
unsafe = true

[markup.goldmark.extensions.passthrough]
enable = true

[markup.goldmark.extensions.passthrough.delimiters]
block = [["$$", "$$"], ["\\[", "\\]"]]
inline = [["$", "$"], ["\\(", "\\)"]]

[frontmatter]
  lastmod = [":git", "lastmod", "date"]

[outputs]
  home = ["HTML", "RSS", "JSON"]

[taxonomies]
  tag = "tags"
  series = "series"

[sitemap]
  changeFreq = "monthly"
  priority = 0.5

[params]
bookingURL = "https://calendly.com/alex-djalali/30min"  # "Book a Call" target on home and footer
definitionLabel = "Definition 1."
definition = "A blog is a set of propositions about language, machines, and the systems between them."
author = "a.j.djalali+claude"
displayName = "a.j.djalali"
description = "a.j.djalali's personal blog"
keywords = "nlp,ai,linguistics,computational-semantics,blog"
images = ["images/og-default.png"]
avatarURL = "images/portrait.png"
info = ["AI Strategy Advisor"]
dateFormat = "January 2, 2006"
since = 2026
customJS = ["js/collapsible-code.js", "js/reading-progress.js", "js/share.js", "js/search.js", "js/publication-abstract.js", "js/back-to-top.js", "js/card-deck.js", "js/reveal.js", "js/topic-filter.js"]
math = true
favicon_32 = "images/favicon-32x32.png"
favicon_16 = "images/favicon-16x16.png"
touchicon = "images/apple-touch-icon.png"
license = '<a rel="license" href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA-4.0</a>'

[params.giscus]
repo = "alexdjalali/alexdjalali.github.io"
repoID = "R_kgDORVsOCg"
category = "Announcements"
categoryID = "DIC_kwDORVsOCs4C3OgY"
mapping = "pathname"
strict = "1"
reactionsEnabled = "1"
emitMetadata = "0"
inputPosition = "top"
theme = "light"
lang = "en"
loading = "lazy"

[params.csp]
childsrc = ["'self'"]
fontsrc = ["'self'", "https://fonts.gstatic.com"]
formaction = ["'self'"]
framesrc = ["'self'", "https://giscus.app"]
imgsrc = ["'self'", "data:", "https://img.shields.io"]
objectsrc = ["'none'"]
stylesrc = ["'self'", "'unsafe-inline'", "https://fonts.googleapis.com"]
scriptsrc = ["'self'", "'unsafe-inline'", "https://cdn.jsdelivr.net", "https://www.googletagmanager.com", "https://giscus.app"]
connectsrc = ["'self'", "https://www.google-analytics.com", "https://www.googletagmanager.com"]

[languages.en]
languageName = "English"

