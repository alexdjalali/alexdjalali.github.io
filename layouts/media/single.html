{{ define "title" }}{{ .Title }} · {{ .Site.Title }}{{ end }}
{{ define "content" }}
<section class="page-hero">
  <p class="kicker">{{ .Params.kicker }}</p>
  <h1 class="display">{{ partial "rise.html" .Params.headline }}</h1>
  {{ with .Description }}<p class="lede">{{ . }}</p>{{ end }}
</section>
<article class="media-content">
  {{ .Content }}
</article>
{{ end }}
