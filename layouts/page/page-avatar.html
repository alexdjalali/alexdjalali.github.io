{{ define "title" }}{{ .Title }} · {{ .Site.Title }}{{ end }}
{{ define "content" }}
<section class="page-hero disclosure-hero">
  <div class="disclosure-hero__text">
    <p class="kicker">{{ .Params.kicker }}</p>
    <h1 class="display">{{ partial "rise.html" .Params.headline }}</h1>
    {{ with .Description }}<p class="lede">{{ . }}</p>{{ end }}
  </div>
  <div class="disclosure-hero__fig frame">{{ partial "figure.html" (dict "kind" "pages" "key" "ai-venn") }}</div>
</section>
<article class="prose disclosure-content">
  {{ .Content }}
</article>
{{ end }}
