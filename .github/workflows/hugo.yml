name: Deploy Hugo site to Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.156.0
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugo CLI
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
      - name: Install uv
        run: pipx install uv
      - name: Sync figure generator
        working-directory: tools/figures
        run: uv sync --frozen
      - name: Check generated figures are in sync
        working-directory: tools/figures
        run: uv run figures check
      - name: Unit tests
        working-directory: tools/figures
        run: uv run pytest -q -m unit
      - name: Build with Hugo
        run: hugo --minify --baseURL "https://alexdjalali.github.io/"
      - name: Check internal links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --config lychee.toml --offline --root-dir ${{ github.workspace }}/public 'public/**/*.html'
      - name: Integration tests
        working-directory: tools/figures
        env:
          BUILT_SITE_DIR: ${{ github.workspace }}/public
        run: uv run pytest -q -m integration
      - name: Lighthouse budget
        run: npx -y @lhci/cli@0.15.1 autorun --config=./lighthouserc.json
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lhci-reports
          if-no-files-found: ignore
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
