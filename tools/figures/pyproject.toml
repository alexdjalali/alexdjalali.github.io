[project]
name = "figures"
version = "0.1.0"
description = "Deterministic SVG figure generator for the blog theme"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
figures = "figures.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "basedpyright>=1.18"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/figures"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit: pure-function tests with no external I/O",
  "integration: tests that run the real hugo binary against the real site",
]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "PLW1514"]
preview = true
explicit-preview-rules = true
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D101", "D102", "D103", "D104"]

[tool.basedpyright]
include = ["src"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
