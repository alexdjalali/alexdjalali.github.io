# Link checking for the built site (public/). CI runs it two ways: offline on every deploy
# (internal links only, blocking) and weekly against the web (external links).

no_progress = true
max_retries = 3
retry_wait_time = 5
timeout = 30
max_concurrency = 16

# Rate-limited (429) is not broken, and neither is forbidden (403): many sites refuse requests
# from data-centre IPs such as GitHub's runners while serving the same page to browsers.
# Rot shows up as 404/410, DNS failures and timeouts, which still fail the check.
accept = ["100..=103", "200..=299", "403", "429"]

exclude = [
  # LinkedIn answers every automated request with a non-standard 999.
  '^https://www\.linkedin\.com/',
  # Serves browsers, but fails the TLS handshake with GitHub's runners.
  '^https://(www\.)?ginew\.com/',
  '^mailto:',
]
